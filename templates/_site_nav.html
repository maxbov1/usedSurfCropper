<div id="page-busy" class="page-busy" hidden role="status" aria-live="polite" aria-busy="true">
<div class="page-busy-card"><span class="loading-spinner" aria-hidden="true"></span><strong id="page-busy-label">Working…</strong></div>
</div>
<script>
(() => {
  const overlay = document.getElementById('page-busy');
  const overlayLabel = document.getElementById('page-busy-label');
  window.showPageBusy = function(label) {
    if (!overlay) return;
    document.body.classList.add('page-busy-active');
    overlay.hidden = false;
    if (overlayLabel) overlayLabel.textContent = label || 'Working…';
  };
  window.clearPageBusy = function() {
    if (!overlay) return;
    document.body.classList.remove('page-busy-active');
    overlay.hidden = true;
  };
  function markBusy(button, label) {
    if (!button || button.disabled || button.dataset.loading === 'true') return;
    button.dataset.loading = 'true';
    button.disabled = true;
    button.textContent = label || 'Working…';
    window.showPageBusy(label || 'Working…');
  }
  document.addEventListener('submit', event => {
    const form = event.target;
    if (!(form instanceof HTMLFormElement) || form.dataset.noBusy === 'true') return;
    markBusy(event.submitter || form.querySelector('button[type="submit"]'), form.dataset.loadingLabel);
  });
  document.addEventListener('click', event => {
    const button = event.target.closest('button[data-loading-action],#good,#save,#download-selected,.download-board,[data-label],#accept-model,#undo');
    if (!button) return;
    const label = button.dataset.loadingLabel ||
      (button.id === 'good' ? 'Saving…' :
       button.id === 'save' ? (button.closest('.shuffle-actions') ? 'Saving and starting crops…' : 'Saving crop…') :
       button.id === 'download-selected' || button.classList.contains('download-board') ? 'Preparing ZIP…' :
       button.dataset.label || button.id === 'accept-model' || button.id === 'undo' ? 'Saving label…' : 'Working…');
    markBusy(button, label);
  }, true);
})();
</script>
