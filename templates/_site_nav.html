<script>
(() => {
  const spinner = '<span class="loading-spinner" aria-hidden="true"></span>';
  function markBusy(button, label) {
    if (!button || button.disabled || button.dataset.loading === 'true') return;
    button.dataset.loading = 'true';
    button.disabled = true;
    button.innerHTML = spinner + (label || 'Working…');
  }
  document.addEventListener('submit', event => {
    const form = event.target;
    if (!(form instanceof HTMLFormElement) || form.dataset.noBusy === 'true') return;
    markBusy(event.submitter || form.querySelector('button[type="submit"]'), form.dataset.loadingLabel);
  });
  document.addEventListener('click', event => {
    const button = event.target.closest('button[data-loading-action],#good,#save,#download-selected,.download-board,[data-label],#accept-model,#undo');
    if (!button) return;
    const label = button.dataset.loadingLabel ||
      (button.id === 'good' ? 'Saving…' :
       button.id === 'save' ? (button.closest('.shuffle-actions') ? 'Saving and starting crops…' : 'Saving crop…') :
       button.id === 'download-selected' || button.classList.contains('download-board') ? 'Preparing ZIP…' :
       button.dataset.label || button.id === 'accept-model' || button.id === 'undo' ? 'Saving label…' : 'Working…');
    markBusy(button, label);
  }, true);
})();
</script>
